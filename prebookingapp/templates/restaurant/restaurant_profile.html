
{% extends 'restaurant/restaurant_home.html' %}
{% block content %}
  <section class="book_section layout_padding">
    <div class="container">
      <div class="heading_container">
        <h2>
        Profile
        </h2>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="form_container">
            <form action="" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {% for i in data %}
                
              <div>
                <input type="text" class="form-control" placeholder="Your Name" name="name" value="{{i.name}}" disabled>
              </div>
              <div>
                <input type="text" class="form-control" placeholder="Your Contact Number" name="phn" value="{{i.phn}}" disabled>
              </div>
              <div>
                <input type="email" class="form-control" placeholder="Your Email" name="email" value="{{i.email}}" disabled>
              </div>
              <div>
                <input type="text" name="adrs" class="form-control" placeholder="Your Address" value="{{i.adrs}}" disabled>
              </div>
              <div>
                <div>
                    <input type="text" name="licence_number" class="form-control" placeholder="Your License Number" value="{{i.licence_number}}" disabled>
                  </div>
                <input type="text" name="plc" class="form-control" placeholder="Your Place" value="{{i.plc}}" disabled>
              </div>
              <div>
                <input type="password" name="pswd" class="form-control" placeholder="Your Password" value="{{i.pswd}}" disabled>
              </div>
              <div class="btn_box" type="submit">
                <a href="/restaurant_edit_profile/?id={{i.id}}" class="btn btn-primary w-60 py-9" style="background-color: rgb(46,31,15); color: white;">Edit Profile</a>
              </div>
              
            </form>
          </div>
        </div>
        <div class="col-md-6">
            <div>
                  <img src="{{ i.img.url }}" alt="User Image" height="150%" width="150%">
              </div>

              {% endfor %}
            </div>
          </div>
      </div>
    </div>
  </section>
  {% endblock %}
